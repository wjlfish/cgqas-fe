# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cgtk.org www.cgtk.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/cgtk; }
    location / { return 301 https://cgtk.org$request_uri; }
}

# www -> apex (证书 SAN 已含 www.cgtk.org)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cgtk.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cgtk.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cgtk.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://cgtk.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cgtk.org;
    server_tokens off;

    root /var/www/cgtk;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    ssl_certificate     /etc/letsencrypt/live/cgtk.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cgtk.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ── PHP 一律 internal: 直连 .php 返回 404, 只有内部重写可达 ──
    location ~ \.php$ {
        internal;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # ── 旧页面 URL 301 (按 request_uri 判断, 不受内部重写影响) ──
    if ($request_uri ~ "^/index\.php")    { return 301 https://cgtk.org/; }
    if ($request_uri ~ "^/about\.php")    { return 301 https://cgtk.org/about; }
    if ($request_uri ~ "^/feedback\.php") { return 301 https://cgtk.org/feedback; }

    # ── 页面伪静态 ──
    location = /            { rewrite ^ /index.php last; }
    location = /about       { rewrite ^ /about.php last; }
    location = /feedback    { rewrite ^ /feedback.php last; }
    location = /guide       { rewrite ^ /guide.php last; }
    location = /review      { rewrite ^ /review.php last; }

    # ── 接口伪静态: /api/<action> -> api.php?action=<action> ──
    location ~ ^/api/([a-z_]+)$ {
        rewrite ^/api/([a-z_]+)$ /api.php?action=$1 last;
    }

    # ── 广告跳转: /go/<target> ──
    location ~ ^/go/([A-Za-z0-9_-]+)$ {
        rewrite ^/go/([A-Za-z0-9_-]+)$ /go.php?to=$1 last;
    }

    # ── 后台接口: /<12位随机串>/api ──
    location ~ "^/([0-9a-f]{12})/api$" {
        rewrite "^/([0-9a-f]{12})/api$" /$1/api.php last;
    }

    # ── 源码/数据目录 404 ──
    location ~ ^/(lib|sql|partials|analysis|db|ops)(/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    # ── 静态资源长缓存 ──
    # 哈希文件名才可长缓存; 不加 expires, 避免与 add_header 产生重复的 Cache-Control
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # suggest.json / manifest.json 由脚本重建(文件名不含哈希), 不能长缓存
    location = /assets/suggest.json {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location = /assets/manifest.json {
        add_header Cache-Control "no-store";
        access_log off;
    }

    location / { try_files $uri $uri/ =404; }

    location = /favicon.ico { access_log off; log_not_found off; }
}
